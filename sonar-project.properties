# Configuration for the standalone SonarScanner CLI used by the isolated
# CI Sonar Analysis workflow (.github/workflows/sonar.yml). The Gradle
# org.sonarqube plugin is still used for local/manual analysis; keep both in sync.
sonar.host.url=https://sonarcloud.io
sonar.organization=goodforgod
sonar.projectKey=GoodforGod_liquibase-clickhouse

sonar.sources=src/main
sonar.tests=src/test
sonar.java.source=11
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
sonar.java.libraries=build/scanner-deps/*.jar
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
