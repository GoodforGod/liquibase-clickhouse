name: CI Pull Request

on:
  pull_request:
    branches:
      - master
      - dev


permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17' ]
    name: Pull Request Java ${{ matrix.java }} action

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'adopt'

      - name: Code Style
        run: './gradlew spotlessCheck'

      - name: Build
        run: './gradlew classes testClasses'

      - name: Test
        run: './gradlew test jacocoTestReport'

      # The SonarCloud analysis runs in a separate, isolated workflow (sonar.yml)
      # triggered by workflow_run, so that the SONAR_TOKEN secret is never exposed
      # to untrusted code from fork pull requests. Here we only stage the inputs the
      # standalone scanner needs; no secrets are available to this job.
      - name: Collect scanner dependencies
        if: matrix.java == '17'
        run: './gradlew copyScannerDeps'

      - name: Save PR metadata
        if: matrix.java == '17'
        run: |
          mkdir -p sonar-pr
          {
            echo "PR_NUMBER=${{ github.event.number }}"
            echo "PR_BRANCH=${{ github.event.pull_request.head.ref }}"
            echo "PR_BASE=${{ github.event.pull_request.base.ref }}"
          } > sonar-pr/pr.env

      - name: Upload analysis input
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: sonar-analysis-input
          retention-days: 1
          path: |
            sonar-project.properties
            src/main
            src/test
            build/classes/java/main
            build/classes/java/test
            build/reports/jacoco/test/jacocoTestReport.xml
            build/scanner-deps
            sonar-pr/pr.env
